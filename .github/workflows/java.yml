name: Java build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile sources
        run: javac -Xlint:all -d out src/Main.java src/basicHoney/HttpHP.java
